<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-label="Ongsho high-level architecture">
  <rect width="960" height="520" rx="24" fill="#fdfbcf" stroke="#000" stroke-width="4"/>
  <text x="480" y="48" text-anchor="middle" font-family="system-ui,sans-serif" font-size="26" font-weight="800" fill="#000">How Ongsho fits together</text>
  <!-- Browser -->
  <rect x="80" y="100" width="200" height="120" rx="20" fill="#14b3f2" stroke="#000" stroke-width="5"/>
  <text x="180" y="155" text-anchor="middle" font-size="18" font-weight="700" fill="#000">Browser</text>
  <text x="180" y="185" text-anchor="middle" font-size="14" fill="#000">React SPA</text>
  <!-- Vercel box -->
  <rect x="340" y="88" width="280" height="144" rx="20" fill="#fff" stroke="#000" stroke-width="5"/>
  <text x="480" y="130" text-anchor="middle" font-size="17" font-weight="700" fill="#000">Frontend hosting</text>
  <text x="480" y="158" text-anchor="middle" font-size="14" fill="#4a4a3a">Static app + /api proxy</text>
  <text x="480" y="186" text-anchor="middle" font-size="13" font-weight="600" fill="#000">(Vercel)</text>
  <!-- API -->
  <rect x="680" y="100" width="200" height="120" rx="20" fill="#bf1d1d" stroke="#000" stroke-width="5"/>
  <text x="780" y="155" text-anchor="middle" font-size="18" font-weight="700" fill="#fdfbcf">Django API</text>
  <text x="780" y="185" text-anchor="middle" font-size="14" fill="#fdfbcf">REST API</text>
  <!-- Render label -->
  <rect x="650" y="240" width="260" height="72" rx="16" fill="#fff" stroke="#000" stroke-width="4"/>
  <text x="780" y="285" text-anchor="middle" font-size="15" font-weight="700" fill="#000">Backend hosting (Render)</text>
  <!-- DB -->
  <rect x="120" y="320" width="220" height="120" rx="20" fill="#0096ff" stroke="#000" stroke-width="5"/>
  <text x="230" y="375" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">PostgreSQL</text>
  <text x="230" y="405" text-anchor="middle" font-size="14" fill="#fff">(Neon)</text>
  <!-- Email -->
  <rect x="420" y="320" width="220" height="120" rx="20" fill="#ff5b00" stroke="#000" stroke-width="5"/>
  <text x="530" y="375" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">Email delivery</text>
  <text x="530" y="405" text-anchor="middle" font-size="14" fill="#fff">Transactional mail</text>
  <!-- Arrows -->
  <path d="M280 160 H340" stroke="#000" stroke-width="4" marker-end="url(#a)"/>
  <path d="M620 160 H680" stroke="#000" stroke-width="4" marker-end="url(#a)"/>
  <path d="M780 220 V240" stroke="#000" stroke-width="4"/>
  <path d="M780 312 V280 H230 V320" fill="none" stroke="#000" stroke-width="4" marker-end="url(#a)"/>
  <path d="M780 312 V300 H530 V320" fill="none" stroke="#000" stroke-width="4" marker-end="url(#a)"/>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L10,3 L0,6 Z" fill="#000"/>
    </marker>
  </defs>
  <text x="480" y="480" text-anchor="middle" font-size="13" fill="#4a4a3a">Payments are recorded in Ongsho; money moves through your usual channels (bKash, Nagad, bank, cash, etc.).</text>
</svg>