name: Run daily billing job

# Alternative scheduler only — disabled by default. Verify Render (or other) cron before enabling.

on:
  schedule:
    # 18:15 UTC ≈ 00:15 Asia/Dhaka (billing calendar uses Dhaka dates in run_daily).
    - cron: "15 18 * * *"
  workflow_dispatch:
    inputs:
      confirm_live_processing:
        description: Confirm live run_daily against production database
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ongsho-run-daily
  cancel-in-progress: false

jobs:
  run_daily:
    if: >-
      vars.RUN_DAILY_JOB_ENABLED == 'true' &&
      (
        (github.event_name == 'schedule') ||
        (github.event_name == 'workflow_dispatch' && inputs.confirm_live_processing == true)
      )
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    env:
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DEBUG: ${{ vars.DEBUG }}
      ALLOWED_HOSTS: ${{ vars.ALLOWED_HOSTS }}
      CSRF_TRUSTED_ORIGINS: ${{ vars.CSRF_TRUSTED_ORIGINS }}
      FRONTEND_BASE_URL: ${{ vars.FRONTEND_BASE_URL }}
      FRONTEND_ORIGINS: ${{ vars.FRONTEND_ORIGINS }}
      DEFAULT_FROM_EMAIL: ${{ vars.DEFAULT_FROM_EMAIL }}
      EMAIL_BACKEND: ${{ vars.EMAIL_BACKEND }}
      REFRESH_COOKIE_SECURE: ${{ vars.REFRESH_COOKIE_SECURE }}
      REFRESH_COOKIE_SAMESITE: ${{ vars.REFRESH_COOKIE_SAMESITE }}
      INVITE_DELIVERY_ENCRYPTION_KEYS: ${{ secrets.INVITE_DELIVERY_ENCRYPTION_KEYS }}
      INVITE_DELIVERY_ENCRYPTION_ACTIVE_VERSION: ${{ vars.INVITE_DELIVERY_ENCRYPTION_ACTIVE_VERSION }}
      SECURE_SSL_REDIRECT: ${{ vars.SECURE_SSL_REDIRECT }}
      TRUST_PROXY_SSL: ${{ vars.TRUST_PROXY_SSL }}
      LOG_LEVEL: ${{ vars.LOG_LEVEL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run daily job
        run: python manage.py run_daily